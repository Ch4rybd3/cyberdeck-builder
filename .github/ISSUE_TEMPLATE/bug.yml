name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: build
    attributes:
      label: Build
      description: Attach the .cyberdeck.json file or paste a share link, if the problem is about a specific deck.
  - type: input
    id: browser
    attributes:
      label: Browser and version
